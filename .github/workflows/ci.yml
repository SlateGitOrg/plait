name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-only: true
      - name: make check (gofmt, go vet, golangci-lint, race tests, coverage >= 80%)
        run: make check
      - name: make demo (offline end-to-end run against the bundled fake cloud)
        run: make demo
